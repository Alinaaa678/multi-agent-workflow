name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          test -f README.md
          test -f docs/PROJECT_OVERVIEW.md
          test -f docs/BRANCHING.md
